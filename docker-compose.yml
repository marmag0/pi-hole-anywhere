services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pi-hole-server
    ports:
      # Bind DNS to the configured local-network address
      - "${LOCAL_IP:?Set LOCAL_IP in .env}:53:53/tcp"
      - "${LOCAL_IP:?Set LOCAL_IP in .env}:53:53/udp"
      # Keep local dashboard access alongside the tunnel
      - "${LOCAL_IP:?Set LOCAL_IP in .env}:80:80/tcp"
    environment:
      TZ: "Europe/Warsaw"
      FTLCONF_webserver_api_password: ${API_PASSWORD:?Set API_PASSWORD in .env}
      FTLCONF_dns_listeningMode: "ALL"
    volumes:
      - "./etc-pihole:/etc/pihole"
      - "./etc-dnsmasq.d:/etc/dnsmasq.d"
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "-o", "/dev/null", "http://127.0.0.1/admin/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      pihole:
        condition: service_healthy
    restart: unless-stopped
